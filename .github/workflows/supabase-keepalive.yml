# Supabase 무료 프로젝트는 7일간 활동이 없으면 일시정지된다(2026-09 실제로 정지됨).
# 사용자 지시: 3일에 한 번 '무조건' 접속해서 기록을 남긴다.
#   ① Supabase 에 ping RPC 를 호출하고 ② 결과(시각·응답 코드)를 keepalive/log.txt 에 한 줄 붙여 커밋한다.
#   커밋이 매번 생기므로 GitHub 의 '60일 무활동 시 예약 워크플로 정지'도 걸리지 않는다.
# 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_ANON_KEY(Publishable key)가 있어야 한다.
# 주소는 게임 코드에도 들어 있는 공개 값이라 여기 적는다(시크릿 URL 이 잘못 들어가 ping=000 이 났던 일, 2026-10-23).
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'   # 3일마다 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: ping supabase
        id: ping
        env:
          URL: https://gnnqttxniktzwiakdumq.supabase.co
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY" || { echo "secrets missing"; echo "code=secrets-missing" >> "$GITHUB_OUTPUT"; exit 1; }
          code=$(curl -sS -m 30 -o /tmp/out -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' || true)
          echo "http $code: $(cat /tmp/out 2>/dev/null)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          test "$code" = "200"
      - name: write log (always)
        if: always()
        run: |
          mkdir -p keepalive
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ping=${{ steps.ping.outputs.code || 'none' }} run=${{ github.run_id }}" >> keepalive/log.txt
          tail -n 300 keepalive/log.txt > /tmp/log && mv /tmp/log keepalive/log.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add keepalive/log.txt
          git commit -m "keepalive: $(date -u +%F) ping=${{ steps.ping.outputs.code || 'none' }}"
          git push
